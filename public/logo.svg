  <!-- wordmark -->
  <text x="250" y="108" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="76" textLength="728" lengthAdjust="spacingAndGlyphs" fill="#E11E26">SUBHAGRUHA</text>
  <text x="614" y="152" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="29" textLength="440" lengthAdjust="spacingAndGlyphs" fill="#1F7A4D">GROUP OF COMPANIES</text>
