    <text x="110" y="208" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="italic" font-size="48" textLength="104" lengthAdjust="spacingAndGlyphs" fill="#E11E26" stroke="#fff" stroke-width="2" paint-order="stroke">SG</text>
